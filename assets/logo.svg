    <rect x="350" y="0" width="162" height="512" fill="#34d399" opacity=".10"/>
    <path d="M60 372 L130 300 L180 322 L232 262 L282 318 L330 286 L392 196 L452 140 L452 512 L60 512Z" fill="url(#ar)"/>
